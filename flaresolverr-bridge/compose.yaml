# Both endpoints run in one container. Publish ports only on a trusted interface.
services:
  moli:
    image: ${MOLI_BRIDGE_IMAGE:-ghcr.io/ujzk/moli-bridge:latest}
    build:
      context: ..
      dockerfile: flaresolverr-bridge/Dockerfile
    environment:
      MOLI_MODE: both
      BRIDGE_MAX_SESSIONS: ${BRIDGE_MAX_SESSIONS:-4}
      CDP_MAX_BROWSERS: ${CDP_MAX_BROWSERS:-4}
    ports:
      - '127.0.0.1:${BRIDGE_PORT:-8191}:8191'
      - '127.0.0.1:${CDP_PORT:-9222}:9222'
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,size=512m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${MOLI_MEMORY_LIMIT:-4g}
    cpus: ${MOLI_CPU_LIMIT:-4.0}
    pids_limit: 512
    restart: unless-stopped
