name: Experimental container
on:
  push:
    branches: [main]
    paths:
      - 'flaresolverr-bridge/**'
      - 'tools/flaresolverr-contract/check-container.mjs'
      - '.dockerignore'
      - 'scripts/prepare-bridge-container.sh'
      - 'scripts/smoke-bridge-container.sh'
      - '.github/workflows/container.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare verified image inputs
        run: ./scripts/prepare-bridge-container.sh
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build AMD64 test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: flaresolverr-bridge/Dockerfile
          platforms: linux/amd64
          load: true
          tags: moli-bridge:verify-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test AMD64 image
        run: MOLI_BRIDGE_IMAGE=moli-bridge:verify-amd64 ./scripts/smoke-bridge-container.sh
      - name: Build ARM64 test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: flaresolverr-bridge/Dockerfile
          platforms: linux/arm64
          load: true
          tags: moli-bridge:verify-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test ARM64 image under QEMU
        run: MOLI_BRIDGE_IMAGE=moli-bridge:verify-arm64 ./scripts/smoke-bridge-container.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push experimental image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: flaresolverr-bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
