name: Experimental container
on:
  push:
    branches: [main]
    paths:
      - 'flaresolverr-bridge/**'
      - 'tools/flaresolverr-contract/check-container.mjs'
      - '.dockerignore'
      - 'scripts/prepare-bridge-container.sh'
      - 'scripts/smoke-bridge-container.sh'
      - '.github/workflows/container.yml'
      - 'moli*/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - '.cargo/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-moli:
    name: Build Moli (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    container: rust:1.96.1-bookworm
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends cmake libclang-dev lld
      - name: Build Moli from this checkout
        shell: bash
        run: |
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            export RUSTFLAGS='-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--no-pie -C link-arg=-Wl,--icf=safe'
          else
            export RUSTFLAGS='-C link-arg=-fuse-ld=lld'
          fi
          cargo build --locked -p moli
          mkdir -p source-binaries
          cp target/debug/moli source-binaries/moli-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moli-source-${{ matrix.arch }}
          path: source-binaries/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build-moli
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test bridge
        working-directory: flaresolverr-bridge
        run: npm ci --ignore-scripts && npm test
      - name: Download source-built Moli binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: moli-source-*
          path: source-binaries
          merge-multiple: true
      - name: Prepare verified image inputs
        env:
          MOLI_SOURCE_BINARY: ${{ github.workspace }}/source-binaries/moli-amd64
          MOLI_SOURCE_ARM64_BINARY: ${{ github.workspace }}/source-binaries/moli-arm64
        run: |
          chmod +x "$MOLI_SOURCE_BINARY" "$MOLI_SOURCE_ARM64_BINARY"
          ./scripts/prepare-bridge-container.sh
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build AMD64 test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: flaresolverr-bridge/Dockerfile
          platforms: linux/amd64
          load: true
          tags: moli-bridge:verify-amd64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test AMD64 image
        run: MOLI_BRIDGE_IMAGE=moli-bridge:verify-amd64 ./scripts/smoke-bridge-container.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push experimental image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: flaresolverr-bridge/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
